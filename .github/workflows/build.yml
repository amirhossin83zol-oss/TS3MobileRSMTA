name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q TS3MobileRSMTA_v0_1-1.zip -d buildsrc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: buildsrc
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --info > build.log 2>&1
          status=$?
          echo "===== BUILD ERROR LOG ====="
          tail -n 250 build.log
          echo "===== END BUILD ERROR LOG ====="
          exit $status

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TS3MobileRSMTA-v0.1-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: buildsrc/build.log        with:
          name: TS3MobileRSMTA-v0.1-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
