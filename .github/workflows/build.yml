name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository files:"
          ls -la
          echo "Workflow files:"
          find .github -type f -maxdepth 3 -print
          echo "ZIP files:"
          find . -type f -name "*.zip" -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d buildsrc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: buildsrc
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TS3MobileRSMTA-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: buildsrc
        run: |
          echo "Starting Gradle build..."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TS3MobileRSMTA-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk        with:
          name: TS3MobileRSMTA-v0.1-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
