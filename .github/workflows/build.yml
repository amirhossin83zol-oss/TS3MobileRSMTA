name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract ZIP
        run: |
          mkdir buildsrc
          unzip -q "$(find . -name '*.zip' | head -1)" -d buildsrc

      - name: Build APK
        working-directory: buildsrc
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TS3MobileRSMTA-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk        working-directory: buildsrc
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TS3MobileRSMTA-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d buildsrc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: buildsrc
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TS3MobileRSMTA-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: buildsrc
        run: |
          echo "Starting Gradle build..."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TS3MobileRSMTA-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk        with:
